name: Daily Summary & Email Delivery

on:
  schedule:
    # 每天北京时间早上 8:00 自动执行（对应国际标准时间 UTC 0:00）
    - cron: '0 0 * * *'
  # 允许你在 GitHub 网页上手动点击按钮立即运行测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-horizon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Run Horizon and Send Email
        env:
          HORIZON_AI_API_KEY: ${{ secrets.HORIZON_AI_API_KEY }}
          HORIZON_AI_BASE_URL: ${{ secrets.HORIZON_AI_BASE_URL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        # 修改为正确的写法：
        run: |
          uv run horizon --config data/config.json

      - name: Commit and push generated summaries
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/summaries/ data/subscribers.json || true
          git diff --staged --quiet || git commit -m "chore: update daily summary and subscribers"
          git push
